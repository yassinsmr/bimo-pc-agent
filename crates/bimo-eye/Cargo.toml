[package]
name = "bimo-eye"
version = "0.1.0"
edition = "2021"
description = "BIMO PC agent — the Eye: local event log, file watcher, hash worker (Track A Unit 2 safe core)"
license = "MIT"

# Standalone crate on purpose (cycle 14): it builds on its own so the
# browser can upload it without editing any existing repo file.
# Cycle 21: wired to bimo-wintrack (window events flow into the eye
# log). Cycle 24: integrated into the workspace — `crates/bimo-eye`
# is a member of the root Cargo.toml and the [workspace] table is
# removed (see track-a-unit2-eye-merge-wintrack.md §8).

[lib]
name = "bimo_eye"
path = "src/lib.rs"

[[bin]]
name = "bimo-eye-self-test"
path = "src/bin/self_test.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
notify = "7"
notify-debouncer-full = "0.4" # pairs with notify 7 (its own dependency)
bimo-wintrack = { path = "../bimo-wintrack" }

# Shot integration (cycle 28): the capture service lives in its own
# crate so the eye core stays buildable without it. The `eye-shots`
# feature wires it in (Windows only — the crate is Windows-only);
# off by default, off on Linux. The council's binding point: the
# session is persistent, so the measured warm cost holds.
[features]
eye-shots = ["dep:bimo-shot"]

[target.'cfg(windows)'.dependencies]
# Shot integration (cycle 28): the capture service lives in its own
# crate so the eye core stays buildable without it. The `eye-shots`
# feature wires it in (Windows only — the crate is Windows-only);
# off by default, off on Linux. The council's binding point: the
# session is persistent, so the measured warm cost holds.
bimo-shot = { path = "../bimo-shot", optional = true }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Cryptography",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
    "UI_Notifications",
    "Data_Xml_Dom",
] }

[profile.release]
strip = true
