[package]
name = "bimo-wintrack"
version = "0.1.0"
edition = "2021"
description = "BIMO PC agent — window-event spike (Track A Unit 2): SetWinEventHook proof + app.open/app.close/app.focus events in the eye log format"
license = "MIT"

# Standalone crate on purpose (cycle 16): it builds on its own so the
# browser can upload it without editing any existing repo file.
# Cycle 24: integrated into the workspace (member of the root
# Cargo.toml; the [workspace] table is removed — see
# track-a-unit2-eye-merge-wintrack.md §8). The binary stays in this
# crate (`eye-window-spike`) as the regression guard.

[lib]
name = "bimo_wintrack"
path = "src/lib.rs"

[[bin]]
name = "eye-window-spike"
path = "src/bin/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
