# Windows hand thin-slice RUN workflow — Track A Unit 3 (the Hand),
# spec track-a-unit3-thin-slice.md v6 + §45 + §45.9, under the §28.2
# council ruling (ج)→(أ): custom install folder under a pre-created
# watched parent (C:\bimo-slice), via TARGETDIR.
#
# RESTRUCTURED (cycle 60, council 17, conditions S1–S5): ALL phases
# S0–S8 now run inside ONE live pwsh step (S-LIVE), holding the eye's
# Process object from arming to stop — the exact form that produced
# the first positive control in diagnostic run (a)
# (`diagnosed-eye-lived-full-cycle`, council 16). Runs 1–2 died at
# S0c with the eye dead at the next step boundary; the live step
# removes the boundary entirely. Tag (S5): this restructure is
# "built on one unreplicated positive control" — a later slice-3
# success must NOT be read back as proof that run (a) replicates.
# M5 tag (S2): any success "does not prove eye survival outside a
# live step nor device performance". F4 (council 18, supersedes S4):
# NO slice run 5 without a new council if run 4 fails in S1 with the
# same signature. S3 (council 17): BIMO_EYE_PLAINTEXT_OK is set inside
# the live step only, never job/machine scope, never on the Legion path.
#
# S1 FIX (cycle 61, council 18, conditions F1–F5): short GNUPGHOME
# under C:\ (C:\gpg-home) + explicit --homedir on every gpg call —
# ONE environmental variable (run 3 failed with "no writable keyring
# found" under RUNNER_TEMP; long dirmngr socket path is the named
# hypothesis, unmeasured); gpg --version + full stderr of every import
# attempt in the artifact and in the S8 verdict (F1); keyserver-first
# + full S1 verification unchanged (F2); the attempt number that
# succeeded is recorded, and a success after a retry does NOT close
# the S1 mechanism question (F3); F5: M5 tag on any run-4 success
# (already present below).
#
# S1 FIX (cycle 62, council 19, conditions G1–G5): two forms of one
# folder — "$gpgHomeWin = C:\gpg-home" for New-Item ONLY,
# "$gpgHome = /c/gpg-home" for gpg ONLY (GNUPGHOME + the five calls);
# run 4 proved MSYS2 gpg 2.4.9 relativizes a Windows path
# (Home: /d/a/.../C:\gpg-home) while PowerShell would root /c/gpg-home
# on D: — a single shared string cannot serve both parsers. F1/F3
# tools stay; full S1 verification unchanged (G3). G5: run 5 alone is
# authorized; no run 6 without a new council if run 5 fails in S1
# with the same signature, and (b) is the declared next candidate.
#
# S1 FIX (cycle 63, council 20, conditions H1–H5): run 5 proved the
# GPG fix (Home: /c/gpg-home, keyserver attempt 1, npp import ok) and
# failed at a NEW point — step (4): $inst.Database($msi, 0) threw
# "[System.__ComObject] does not contain a method named 'Database'".
# Council 20 verdict (a): replace the COM block with direct P/Invoke
# calls to Msi* from msi.dll (MsiOpenDatabase / MsiDatabaseOpenView /
# MsiViewExecute / MsiViewFetch / MsiRecordGetString), workflow only
# (H1); the proof is S1 itself succeeding with a real ProductCode read
# (H2 — success without a real read is (b) in disguise); run 6 alone
# is authorized, no run 7 without a new council if run 6 fails at the
# same point, and (b) (drop COM from S1) is the declared next candidate
# (H3); P/Invoke is the NAMED candidate, 5.1 is a diagnostic fallback
# only by a later council decision, never a first plan (H4); the COM
# failure mechanism stays open (H5). S1.6/S6/S7 ProductState calls are
# NOT touched — outside the named block.
#
# DIAGNOSTIC RUN (cycle 64, council 21, conditions D1–D5): run 6
# passed S1 fully (first complete S1; ProductCode read via P/Invoke)
# and failed at a NEW point — S6 `install-location-missing`: TWO
# layers at once (ProductInfo(InstallLocation) returned "" AND the
# custom folder does not exist at all after a "successful" install,
# ProductState 5). Council 21 verdict (a): ONE diagnostic run with a
# NAMED capture list, then council 22 decides the fix from named
# facts. D1: capture-only change — a new step S-DIAG between S3 and
# S6 collecting (1) recursive listings of C:\bimo-slice +
# C:\Program Files\Notepad++ + C:\Program Files (x86)\Notepad++;
# (2) the uninstall key (InstallLocation, DisplayName,
# UninstallString) read BEFORE S7; (3) the MSI /L*v log, enabled via
# MsiEnableLog in the supervisor (msi.rs) so the MsiInstallProduct
# invocation and its command line stay byte-identical; (4) notepad++.exe
# presence in the named locations only; (5) MsiGetProductInfo
# (P/Invoke) crossed with ProductInfo (COM). No change to the install
# invocation, no change to S6 pass/fail logic. The S8 cosmetic fix
# (`$($env:GITHUB_RUN_ID)` in the commit message) rides in the same
# edit (zero risk). D2: S-DIAG sits between S3 and S6; its outputs are
# published even if S6 fails; the timeout ceiling is re-checked
# (2430 s, margin 270 s). D3: this diagnostic run alone is authorized;
# NO slice (fix) run without council 22. D4: council-22 decision tree
# is fixed in advance (default → fix (c); sub-path → fix check path;
# right place without InstallLocation → fix (b); no files at all →
# spec-level rethink, neither (b) nor (c)). D5: both S6 mechanism
# questions stay open until the named facts close them.
#
# SLICE RUN 8 FIX (cycle 65, council 22, conditions E1–E5):
# verdict (j1)+(b) — pass INSTALLFOLDER + drop the InstallLocation
# condition from S6. E1: S6 no longer gates on InstallLocation
# (diagnostic run 7 proved this MSI never writes ARPINSTALLLOCATION
# — two-API cross-check, both rc 0 and "", zero occurrences in the
# MSI log); the verdict is ProductState + notepad++.exe under
# SLICE_INSTALL_DIR + the folder listing (S-DIAG, E3). E2: the
# MsiInstallProduct command line is literally
# INSTALLFOLDER=C:\bimo-slice\Notepad++ (supervisor.rs), TARGETDIR
# unchanged. E3: S-DIAG stays (both roots listed + exe_by_root before
# any success verdict — the MSI log line alone is NOT success). E4:
# full verification stays (S1 pass, ProductState = 5, S7 clean, eye
# alive). E5: run 8 alone; NO run 9 without a new council if run 8
# fails at the same point (custom 0 entries, default 228 with the
# exe, S6 fails notepad-exe-missing) — declared candidate then is
# (j2) WITH (b), never (j2) alone. §28.2(a) premise INVALIDATED for
# this MSI: TARGETDIR reaches the log but does not redirect a folder
# rooted in ProgramFiles64Folder — never retry TARGETDIR alone.
#
# SLICE RUN 10 FIX (cycle 68, council 25, verdict (a) — dynamic settle
# before the S4 witness read): run 9 proved S4 read the eye log ~0.9 s
# BEFORE the earliest possible debounced event (raw tap received the
# burst 00:25:47 + 2 s debounce = 00:25:49; S4 read 00:25:48.13) — and
# the failure then fired the revert, which deleted notepad++.exe
# before the eye could ever report it. The fix is workflow-only (no
# eye-code change): before S4 reads, wait for DYNAMIC SETTLE — quiet
# = no new raw file event (Create/Modify/Remove) under WATCH_PARENT
# (probe prefix excluded) for a full debounce (2 s), then an extra
# debounce (2 s) for the eye log to catch up; cap 30 s; at the cap
# read anyway and record settle_cap_hit: true in the verdict (never
# a silent success on a cap). Implemented as one 4 s quiet window
# (strictly stronger than the council's two phases: if 4 s passed
# with no event, both phases hold). The settle breaks the
# self-destruction loop on the SUCCESS path (the revert runs in
# finally AFTER the S4 verdict, so delaying the read delays the
# revert); on the CAP path the loop stays alive — recorded, never
# hidden. The four settle timestamps (settle_start_ts,
# last_raw_file_event_ts, settle_decision_ts, s4_read_ts) go into
# witness.json. Acceptance unchanged (≥1 install.detected under
# SLICE_INSTALL_DIR in the window). Run 10 alone; no run 11 without
# council 26; declared candidate then is (b) with the debounced-line
# check advisory. A missing raw log fails LOUDLY at settle start —
# never mistake a missing log for a quiet tree.
#
# S4 STRESS TEST — REMOVED (cycle 73, council 31 condition 1): the one-shot
# stress harness (injector job + S-STRESS verdict) is gone; run 14 passed
# it (§9 rev.2: injection under WATCH_PARENT, 5 s nominal quiet, evidence-first
# verdict) and council 31 adopted the run conditionally. The 5 s NOMINAL quiet
# threshold in the settle loop STAYS — it is production settle behaviour, not
# part of the harness. The evidence-first verdict pattern is carried as a named
# design requirement for the `update` build (council 31 condition 4: offline
# acceptance fixture before any `update` code). This push fires regression run 15;
# M5 closes when run 15 is green (council 31). No third stress run without a
# new council.
#
# Execution order note: the spec numbers S4 (witness), S5 (shot),
# S6 (strong evidence) in that order, but S4's window needs s6_ts
# (written by S6) and S5 runs after S6 (§29.3). The live step
# therefore executes S3 → S6 → S4 → S5 → S7 → stop → S8; the numbers
# are spec labels, not temporal order.
#
# Mandatory revert (§19/§27/§37.1): whenever S3 completed (result
# done) and any later step fails — or S6 is unreadable (assume present)
# — the revert (S7) runs in the live step's `finally` block, before
# the eye is stopped and before S8 assembles the verdict. The finally
# keys off the in-script S3_SUCCEEDED flag, never off step outcomes.
# probe-timeout-unsettled (no hand-slice.json) runs NO revert: the
# machine is discarded per §27.2.
#
# Timeout ceiling (S1): the S0-ceiling step below computes the
# worst-case budget of the live step and asserts it fits inside the
# job's 45-minute timeout BEFORE anything is armed. The live step
# itself carries timeout-minutes: 42 as a backstop (raised from 40 in
# cycle 68: the S4 settle cap adds 30 s to the worst case, 2430 s ->
# 2460 s, which would otherwise exceed the 40-minute live-step
# backstop). Cycle 73 removes the 30 s injector-job wait again:
# worst case back to 2460 s, margin 240 s; the job timeout stays
# 45 minutes.
# If the live step
# is killed by its timeout, no verdict JSON is published — the run
# fails loudly with no verdict, and the (ephemeral) runner machine
# is discarded with whatever install state it holds.
#
# Raw-log upload (§28.2 council condition 4, mandatory): the artifact
# always includes eye-events.jsonl + the eye stdout/stderr logs.
# Eye death (§28.2 condition 5): the eye is checked alive at S4 time
# from the HELD Process object (no Get-Process-by-pid race); a dead
# eye is recorded in the verdict, never passed silently.
#
# Naming (builder decision B3): this is a NEW file. The spike workflow
# (windows-hand-thin-slice.yml) stays untouched — the spike is capped
# at 4 runs by council ruling and must never re-run; overwriting it
# with the slice run would destroy that guard.

name: windows-hand-thin-slice-run

# REGRESSION GATE (cycle 70, council 27 condition 1 — PERMANENT):
# the `push` trigger below is the slice's future-run mechanism. It is
# NOT temporary: it stays armed on this branch so that any later push
# touching the slice re-runs it on real Windows. A `schedule` (cron)
# trigger was REJECTED as the mechanism: scheduled workflows only run
# from the default branch, and this file lives on hand-thin-slice-c50.
# The push trigger is the only workable automatic mechanism;
# workflow_dispatch stays as the manual fallback (the web UI lists
# workflows from the default branch only, so dispatch from the UI is
# impossible, and no API token exists on this machine).
# REOPEN RULE (council 27): any later run whose verdict is not `pass`
# reopens M5 (the thin slice) IMMEDIATELY — the unit returns to open
# and no further slice run happens without a new council. The cycle-55
# cap ("do not re-add the push trigger") applied to the SPIKE workflow
# (windows-hand-thin-slice.yml) only and is superseded here by council 27.
# COUNCIL 31 VERDICT (cycle 73, run 14 pass — verdict (ب), 4 binding conditions):
# Run 14 adopted as proof of mechanism + real quiet after an out-of-install-dir
# injection ONLY (quiet_after_inject true value 4.615 s, quiet_nominal 5.159 s —
# stored 5.0/5.0 fields are NOT reproducible from the timestamps; corrected in
# the dev log + capsule before M5 closes). Injector removed in this push; run 15
# is the regression (judged by the slice verdict alone). M5 CLOSES when run 15 is
# green, recorded in its narrow scope literally; late write inside the product
# folder stays an open named arrival-day unknown. Condition 4 (offline verdict-logic
# fixture) blocks the `update` build, not run 15. No third stress run without a
# new council.
# Paths: only files the slice run consumes (built crates bimo-eye /
# bimo-hand / bimo-shot, the lockfile, this workflow, the sourced
# helper script). bimo-core is NOT a dependency of any built crate,
# so it is excluded on purpose — a change there cannot affect this run.
on:
  push:
    branches: [hand-thin-slice-c50]
    paths:
      - .github/workflows/windows-hand-thin-slice-run.yml
      - crates/bimo-eye/**
      - crates/bimo-hand/**
      - crates/bimo-shot/**
      - Cargo.toml
      - Cargo.lock
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: write

env:
  SLICE_INSTALL_DIR: 'C:\bimo-slice\Notepad++'
  WATCH_PARENT: 'C:\bimo-slice'
  MSI_SHA256: e3b0607a092ce2604fbdac027db2c94915995e8e568ebd226f8c5493c2f61a80
  MSI_SIZE: 7933952
  WINGET_PRODUCT_CODE: '{A23B657D-838B-4C9B-8F9D-386E50C1A76B}'
  WINGET_UPGRADE_CODE: '{CDB13460-04DF-4708-A7FD-4CB4A0684605}'
  GPG_FPR: 14BCE4362749B2B51F8C71226C429F1D8D84F46E
  MSI_URL: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.9.1/npp.8.9.9.1.Installer.x64.msi
  MSI_SIG_URL: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.9.1/npp.8.9.9.1.Installer.x64.msi.sig
  CHECKSUMS_URL: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.9.1/npp.8.9.9.1.checksums.sha256
  CHECKSUMS_SIG_URL: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.9.1/npp.8.9.9.1.checksums.sha256.sig
  GPG_KEY_URL: https://raw.githubusercontent.com/notepad-plus-plus/notepad-plus-plus/master/nppGpgPub.asc
  KEYSERVER_URL: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x14BCE4362749B2B51F8C71226C429F1D8D84F46E

jobs:
  slice:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hand-thin-slice-c50

      - name: Install Rust (stable + MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build hand + eye + shot for Windows
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --locked -p bimo-hand -p bimo-eye -p bimo-shot

      - name: S0-ceiling timeout check (council 17, S1)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sliceId = "slice-$env:GITHUB_RUN_ID"
          $sliceDir = "$env:RUNNER_TEMP\bimo-slice-$sliceId"
          $eyeData = "$sliceDir\eye-data"
          $handData = "$sliceDir\hand-data"
          "SLICE_ID=$sliceId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SLICE_DIR=$sliceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EYE_DATA=$eyeData" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HAND_DATA=$handData" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $eyeData | Out-Null
          New-Item -ItemType Directory -Force -Path $handData | Out-Null
          # Worst-case budget for the S-LIVE step, line by line. Each
          # line is a ceiling, not a measurement: S1 fetch is 5 curls
          # at --max-time 120 each; the install and revert phases are
          # each capped at 600 s (the S7 external timeout from the
          # spec); probes/arm/stop/publish are small fixed costs.
          # The job timeout below MUST match the job's timeout-minutes.
          $jobTimeoutSecs = 45 * 60
          $budget = @(
            @{ item = "arm + S0c probe"; secs = 90 }
            @{ item = "S1 fetch (5 x curl --max-time 120)"; secs = 600 }
            @{ item = "S1 GPG + Authenticode + P/Invoke"; secs = 120 }
            @{ item = "Phase 1 install (S2+S3)"; secs = 600 }
            @{ item = "S-DIAG capture (listing + registry + MSI log)"; secs = 60 }
            @{ item = "S6 + S4 + S5 (incl. S4 settle cap 30 s, council 25)"; secs = 210 }
            @{ item = "S7 revert"; secs = 600 }
            @{ item = "stop eye + S8 assemble/publish"; secs = 180 }
          )
          $total = ($budget | Measure-Object -Property secs -Sum).Sum
          $margin = $jobTimeoutSecs - $total
          $check = @{
            job_timeout_secs = $jobTimeoutSecs
            live_step_timeout_minutes = 42
            budget = $budget
            worst_case_secs = $total
            margin_secs = $margin
            fits = ($margin -gt 0)
          }
          $check | ConvertTo-Json -Depth 4 | Out-File -FilePath "$sliceDir\slice-timeout-check.json" -Encoding utf8
          Write-Host "S0-ceiling: worst case ${total}s of ${jobTimeoutSecs}s, margin ${margin}s"
          if (-not $check.fits) { throw "S0-ceiling FAIL: worst-case budget ${total}s exceeds job timeout ${jobTimeoutSecs}s — live step not started" }
          Write-Host "S0-ceiling pass"

      - name: S-LIVE all phases in ONE live step (council 17, S1)
        shell: pwsh
        timeout-minutes: 42
        run: |
          $ErrorActionPreference = "Continue"
          . $env:GITHUB_WORKSPACE\.github\scripts\spike-log.ps1
          $sliceDir = $env:SLICE_DIR
          $eyeData = $env:EYE_DATA
          $handData = $env:HAND_DATA
          $logPath = "$eyeData\eye-events.jsonl"
          $eyeProc = $null; $eyePid = $null; $eyeLaunchTs = $null
          $eyeExitCode = $null; $eyeExitTs = $null; $eyeKilledByStop = $false
          $eyeAliveBeforeStop = $null; $eyeStoppedOk = $false
          $s3Succeeded = $false
          $liveError = $null
          $checkpoints = [System.Collections.ArrayList]::new()
          function Write-Checkpoint($phase, $note) {
            $cp = @{ phase = $phase; ts = [DateTimeOffset]::UtcNow.ToString("o"); note = $note }
            [void]$checkpoints.Add($cp)
            Write-Host "CHECKPOINT ${phase}: $note"
          }
          function Fail($msg) { throw $msg }
          try {
            # --- S0 precheck (custom dir absent + game_mode=false + free space) ---
            Write-Checkpoint "S0" "enter"
            New-Item -ItemType Directory -Force -Path $env:WATCH_PARENT | Out-Null
            if (Test-Path $env:SLICE_INSTALL_DIR) { Fail "S0 fail: install dir already exists: $env:SLICE_INSTALL_DIR" }
            $drive = Get-PSDrive C
            $need = [int64]$env:MSI_SIZE + 512MB
            if ($drive.Free -lt $need) { Fail "S0 fail: free space on C: $($drive.Free) < $need" }
            Write-Host "S0 pass: install dir absent, free space on C: $($drive.Free) bytes"
            # --- S0b arm eye (watch C:\bimo-slice), hold the Process object ---
            Write-Checkpoint "S0b" "enter"
            Write-Host "resolved eye log path: $logPath"
            # Plaintext log is REQUIRED for the PowerShell witness checks
            # (spike workflow header); the opt-in is recorded in the eye
            # log itself. S3 (council 17): set INSIDE this step only —
            # a step-scoped env var never leaks to later steps, the job,
            # or the machine. Throwaway runner log, never real user data.
            $env:BIMO_EYE_PLAINTEXT_OK = "1"
            $eyeExe = "$env:GITHUB_WORKSPACE\target\x86_64-pc-windows-msvc\release\bimo-eye-self-test.exe"
            $eyeProc = Start-Process -FilePath $eyeExe -ArgumentList @(
              "--watch", "--data-dir", $eyeData,
              "--watch-dirs", $env:WATCH_PARENT,
              "--snapshot-secs", "1", "--heartbeat-secs", "2",
              "--max-secs", "1800"
            ) -WindowStyle Hidden -PassThru -RedirectStandardOutput "$sliceDir\eye-stdout.log" -RedirectStandardError "$sliceDir\eye-stderr.log"
            $eyePid = $eyeProc.Id
            $eyeLaunchTs = [DateTimeOffset]::UtcNow
            $eyePid | Out-File -FilePath "$sliceDir\eye-pid.txt" -Encoding utf8
            $deadline = (Get-Date).AddSeconds(30)
            $armed = $false
            while ((Get-Date) -lt $deadline) {
              $hb = "$eyeData\heartbeat.json"
              if (Test-Path $hb) {
                $ts = (Get-Content $hb -Raw | ConvertFrom-Json).ts
                $age = ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($ts)).TotalSeconds
                if ($age -lt 10) { $armed = $true; break }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $armed) { Fail "S0b fail: no fresh heartbeat.json within 30 s (R9)" }
            $armTs = [DateTimeOffset]::UtcNow
            $armTs.ToString("o") | Out-File -FilePath "$sliceDir\arm-ts.txt" -Encoding utf8
            @{ slice_id = $env:SLICE_ID; arm_ts = $armTs.ToString("o"); s3_ts = $null; s6_ts = $null; window_end_ts = $null; product_dir_expected = $env:SLICE_INSTALL_DIR; probe_prefix = "$env:WATCH_PARENT\bimo-slice-probe-$env:SLICE_ID"; msi_sha256 = $env:MSI_SHA256; product_code = $null; install_location_expected = $env:SLICE_INSTALL_DIR } | ConvertTo-Json | Out-File -FilePath "$sliceDir\slice-window.json" -Encoding utf8
            Write-Host "S0b pass: eye armed, pid $eyePid, arm_ts $($armTs.ToString('o'))"
            # --- S0c sense probe (10 s unified, §36.2) ---
            Write-Checkpoint "S0c" "enter"
            $probeDir = "$env:WATCH_PARENT\bimo-slice-probe-$env:SLICE_ID"
            New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
            $probeFile = "$probeDir\probe.exe"
            New-Item -ItemType File -Force -Path $probeFile | Out-Null
            $armTsParsed = [DateTimeOffset]::Parse((Get-Content "$sliceDir\arm-ts.txt" -Raw).Trim())
            $deadline = (Get-Date).AddSeconds(10)
            $seen = $false
            while ((Get-Date) -lt $deadline) {
              $events = Read-EyeLog -Path $logPath
              # Cycle-55 diagnosis (slice run 1): every log line was a
              # DPAPI wrapper ({"data","enc"}, no "type") — the opt-in
              # never took effect. Fail LOUDLY on that signature at once
              # instead of burning the 10 s and reporting a bare miss.
              if ($events.Count -gt 0 -and (@($events | Where-Object { $null -ne $_.type }).Count -eq 0)) {
                Fail "S0c fail: log-encrypted — eye-events.jsonl has $($events.Count) lines but none carries a type field (DPAPI wrappers: BIMO_EYE_PLAINTEXT_OK did not take effect)"
              }
              $hit = @($events | Where-Object { $_.path -eq $probeFile -and $_.type -in @("file.completed", "install.detected") })
              if ($hit.Count -ge 1) { $seen = $true; break }
              Start-Sleep -Milliseconds 500
            }
            Remove-Item -Recurse -Force $probeDir -ErrorAction SilentlyContinue
            if (-not $seen) { Fail "S0c fail: probe-failed — no eye event for $probeFile within 10 s (R10)" }
            Write-Host "S0c pass: probe sensed"
            # --- S1 fetch + verify + measure (four checks, §24.2) ---
            Write-Checkpoint "S1" "enter"
            $msi = "$sliceDir\npp.8.9.9.1.Installer.x64.msi"
            $msiSig = "$msi.sig"
            $sums = "$sliceDir\npp.8.9.9.1.checksums.sha256"
            $sumsSig = "$sums.sig"
            $keyAsc = "$sliceDir\nppGpgPub.asc"
            $keySrv = "$sliceDir\keyserver.asc"
            "MSI_PATH=$msi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            curl.exe --fail --location --max-time 120 -o $msi $env:MSI_URL
            if ($LASTEXITCODE -ne 0) { Fail "S1 fail: MSI download failed (curl exit $LASTEXITCODE)" }
            curl.exe --fail --location --max-time 120 -o $msiSig $env:MSI_SIG_URL
            if ($LASTEXITCODE -ne 0) { Fail "S1 fail: MSI sig download failed (curl exit $LASTEXITCODE)" }
            curl.exe --fail --location --max-time 120 -o $sums $env:CHECKSUMS_URL
            if ($LASTEXITCODE -ne 0) { Fail "S1 fail: checksums download failed (curl exit $LASTEXITCODE)" }
            curl.exe --fail --location --max-time 120 -o $sumsSig $env:CHECKSUMS_SIG_URL
            if ($LASTEXITCODE -ne 0) { Fail "S1 fail: checksums sig download failed (curl exit $LASTEXITCODE)" }
            curl.exe --fail --location --max-time 120 -o $keyAsc $env:GPG_KEY_URL
            if ($LASTEXITCODE -ne 0) { Fail "S1 fail: GPG key download failed (curl exit $LASTEXITCODE)" }
            # (1) Published SHA-256 vs §29-4 + the checksums file.
            $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $env:MSI_SHA256.ToLower()) { Fail "S1 fail: sha256 mismatch ($hash)" }
            $sumsLine = Get-Content $sums | Where-Object { $_ -match "npp\.8\.9\.9\.1\.Installer\.x64\.msi" }
            if (-not $sumsLine -or $sumsLine -notmatch $env:MSI_SHA256.ToLower()) { Fail "S1 fail: checksums file does not list the published hash" }
            $size = (Get-Item $msi).Length
            if ($size -ne [int64]$env:MSI_SIZE) { Fail "S1 fail: size-mismatch ($size != $env:MSI_SIZE)" }
            # (2) GPG: keyserver first, nppGpgPub.asc second (§43.4);
            # compare the fpr line IMMEDIATELY following `pub` (field 10);
            # the subkey fpr is never compared.
            # Council 18, F1 (ONE environmental variable + measurement
            # tools only): short GNUPGHOME under C:\ — the run-3
            # failure was "no writable keyring found" with GNUPGHOME
            # under RUNNER_TEMP (long dirmngr socket path is the named
            # hypothesis, unmeasured) — plus explicit --homedir on
            # EVERY gpg call. No file-existence check before import
            # (weakest argument — fixes a problem that did not occur).
            # Council 18, F3: record the attempt number that succeeded
            # + full stderr of every attempt; a success after a retry
            # does NOT close the S1 mechanism question.
            # Council 19, G1 (dual-parser trap, run-4 evidence):
            # MSYS2 gpg 2.4.9 treats a Windows path as RELATIVE —
            # gpg-version.txt in run 4 read
            # "Home: /d/a/bimo-pc-agent/bimo-pc-agent/C:\gpg-home"
            # — so gpg gets the POSIX form "/c/gpg-home" ONLY.
            # PowerShell roots "/c/gpg-home" on the current drive
            # (D: on the runner) and would create D:\c\gpg-home, so
            # New-Item gets the Windows form "C:\gpg-home" ONLY.
            # Two variables for one folder, never one shared string;
            # no "C:/gpg-home" form (untested third form, rejected).
            $gpgHomeWin = "C:\gpg-home"
            $gpgHome = "/c/gpg-home"
            $env:GNUPGHOME = $gpgHome
            New-Item -ItemType Directory -Force -Path $gpgHomeWin | Out-Null
            $gpgVersion = (gpg --version 2>&1 | Out-String).Trim()
            $gpgVersion | Out-File -FilePath "$sliceDir\gpg-version.txt" -Encoding utf8
            Write-Host "gpg version: $(($gpgVersion -split "`n" | Select-Object -First 1)); GNUPGHOME=$gpgHome"
            curl.exe --fail --silent --show-error --max-time 30 $env:KEYSERVER_URL -o $keySrv
            if ($LASTEXITCODE -ne 0) { Fail "S1 fail: keyserver fetch failed (curl exit $LASTEXITCODE)" }
            $gpgImportAttempt = $null
            $keyserverStderr = @()
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              $stderrFile = "$sliceDir\gpg-keyserver-attempt$attempt.stderr"
              gpg --batch --homedir $gpgHome --import $keySrv 2> $stderrFile
              $code = $LASTEXITCODE
              if (Test-Path $stderrFile) { $keyserverStderr += (Get-Content $stderrFile -Raw) } else { $keyserverStderr += $null }
              if ($code -eq 0) { $gpgImportAttempt = $attempt; break }
              Write-Host "gpg keyserver import attempt $attempt failed (exit $code); stderr saved to $stderrFile"
              if ($attempt -eq 2) { Fail "S1 fail: keyserver key import failed (attempts 1-2; stderr in gpg-keyserver-attempt*.stderr)" }
            }
            $nppStderrFile = "$sliceDir\gpg-npp-attempt1.stderr"
            gpg --batch --homedir $gpgHome --import $keyAsc 2> $nppStderrFile
            if ($LASTEXITCODE -ne 0) { Fail "S1 fail: nppGpgPub.asc import failed" }
            $cols = gpg --batch --homedir $gpgHome --with-colons --list-keys | Out-String
            $lines = $cols -split "`n"
            $fpr = $null
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^pub:") {
                if ($lines[$i+1] -match "^fpr:") { $fpr = ($lines[$i+1] -split ":")[9]; break }
              }
            }
            if ($fpr -ne $env:GPG_FPR) { Fail "S1 fail: gpg-mismatch (fpr after pub: $fpr)" }
            gpg --batch --homedir $gpgHome --verify $msiSig $msi
            if ($LASTEXITCODE -ne 0) { Fail "S1 fail: gpg-mismatch on the MSI signature" }
            gpg --batch --homedir $gpgHome --verify $sumsSig $sums
            if ($LASTEXITCODE -ne 0) { Fail "S1 fail: gpg-mismatch on the checksums signature" }
            # (3) Authenticode at runtime.
            $sig = Get-AuthenticodeSignature $msi
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "NOTEPAD\+\+") { Fail "S1 fail: unsigned-msi (Authenticode: $($sig.Status))" }
            # (4) P/Invoke read of ProductCode/UpgradeCode (§35.4) + winget cross-check (§35.5).
            # Council 20, H1/H4 (cycle 63): COM (WindowsInstaller.Installer +
            # $inst.Database($msi, 0)) failed in run 5 with
            # "[System.__ComObject] does not contain a method named 'Database'"
            # — mechanism unknown (H5: three hypotheses on equal footing),
            # so COM is bypassed entirely via direct Msi* calls from msi.dll.
            # No here-string: the C# source is an array of single-quoted
            # lines (a here-string terminator cannot sit at column 0
            # inside a YAML literal block).
            $msiCs = @(
              'using System;',
              'using System.Runtime.InteropServices;',
              'using System.Text;',
              'public static class MsiNative {',
              '  [DllImport("msi.dll", CharSet = CharSet.Unicode)]',
              '  public static extern uint MsiOpenDatabase(string szDatabasePath, IntPtr phPersist, out IntPtr phDatabase);',
              '  [DllImport("msi.dll", CharSet = CharSet.Unicode)]',
              '  public static extern uint MsiDatabaseOpenView(IntPtr hDatabase, string szQuery, out IntPtr phView);',
              '  [DllImport("msi.dll")]',
              '  public static extern uint MsiViewExecute(IntPtr hView, IntPtr hRecord);',
              '  [DllImport("msi.dll")]',
              '  public static extern uint MsiViewFetch(IntPtr hView, out IntPtr phRecord);',
              '  [DllImport("msi.dll", CharSet = CharSet.Unicode)]',
              '  public static extern uint MsiRecordGetString(IntPtr hRecord, uint iField, StringBuilder szValueBuf, ref uint pcchValueBuf);',
              '  [DllImport("msi.dll", CharSet = CharSet.Unicode)]',
              '  public static extern uint MsiGetProductInfo(string szProduct, string szProperty, StringBuilder lpValueBuf, ref uint pcchValueBuf);',
              '  [DllImport("msi.dll")]',
              '  public static extern uint MsiCloseHandle(IntPtr hAny);',
              '}'
            )
            Add-Type -TypeDefinition ($msiCs -join "`n")
            function Get-MsiProp($name) {
              $hDb = [IntPtr]::Zero; $hView = [IntPtr]::Zero; $hRec = [IntPtr]::Zero
              try {
                # phPersist = NULL = MSIDBOPEN_READONLY.
                $rc = [MsiNative]::MsiOpenDatabase($msi, [IntPtr]::Zero, [ref]$hDb)
                if ($rc -ne 0) { throw "MsiOpenDatabase failed (rc=$rc)" }
                $rc = [MsiNative]::MsiDatabaseOpenView($hDb, "SELECT Value FROM Property WHERE Property = '$name'", [ref]$hView)
                if ($rc -ne 0) { throw "MsiDatabaseOpenView failed for $name (rc=$rc)" }
                $rc = [MsiNative]::MsiViewExecute($hView, [IntPtr]::Zero)
                if ($rc -ne 0) { throw "MsiViewExecute failed for $name (rc=$rc)" }
                $rc = [MsiNative]::MsiViewFetch($hView, [ref]$hRec)
                if ($rc -eq 259) { return $null }
                if ($rc -ne 0) { throw "MsiViewFetch failed for $name (rc=$rc)" }
                $len = [uint]1024
                $sb = New-Object System.Text.StringBuilder 1024
                $rc = [MsiNative]::MsiRecordGetString($hRec, 1, $sb, [ref]$len)
                if ($rc -eq 234) {
                  $sb = New-Object System.Text.StringBuilder ([int]$len)
                  $rc = [MsiNative]::MsiRecordGetString($hRec, 1, $sb, [ref]$len)
                }
                if ($rc -ne 0) { throw "MsiRecordGetString failed for $name (rc=$rc)" }
                return $sb.ToString()
              } catch {
                Fail "S1 fail: msi-pinvoke-read failed for $name ($($_.Exception.Message))"
              } finally {
                if ($hRec -ne [IntPtr]::Zero) { [void][MsiNative]::MsiCloseHandle($hRec) }
                if ($hView -ne [IntPtr]::Zero) { [void][MsiNative]::MsiCloseHandle($hView) }
                if ($hDb -ne [IntPtr]::Zero) { [void][MsiNative]::MsiCloseHandle($hDb) }
              }
            }
            $code = Get-MsiProp "ProductCode"
            $upcode = Get-MsiProp "UpgradeCode"
            if ([string]::IsNullOrEmpty($code)) { Fail "S1 fail: product-code-unreadable" }
            if ($code -ne $env:WINGET_PRODUCT_CODE) { Fail "S1 fail: product-code-mismatch ($code != $env:WINGET_PRODUCT_CODE) — blocked" }
            if ($upcode -ne $env:WINGET_UPGRADE_CODE) { Fail "S1 fail: upgrade-code-mismatch ($upcode)" }
            "PRODUCT_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "UPGRADE_CODE=$upcode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            @{ slice_id = $env:SLICE_ID; command_id = "slice-npp-001"; msi_path = $msi; msi_sha256 = $hash; msi_size_bytes = $size; product_code = $code; upgrade_code = $upcode; install_dir = $env:SLICE_INSTALL_DIR; install_location_expected = $env:SLICE_INSTALL_DIR; name_substring = "Notepad++"; ttl_secs = 3600 } | ConvertTo-Json | Out-File -FilePath "$sliceDir\slice-inputs.json" -Encoding utf8
            $w = Get-Content "$sliceDir\slice-window.json" -Raw | ConvertFrom-Json
            $w.product_code = $code
            $w | ConvertTo-Json | Out-File -FilePath "$sliceDir\slice-window.json" -Encoding utf8
            Write-Host "S1 pass: hash+size+GPG+Authenticode+winget ok; product_code=$code"
            # --- S1.6 ProductState not installed ---
            Write-Checkpoint "S1.6" "enter"
            $inst2 = New-Object -ComObject WindowsInstaller.Installer
            $state = $inst2.ProductState($code)
            if ($state -notin @(-1, 2)) { Fail "S1.6 fail: preinstalled (ProductState=$state)" }
            Write-Host "S1.6 pass: ProductState=$state (not installed)"
            # --- Phase 1 — 8.12 install (negatives + S2+S3) ---
            Write-Checkpoint "Phase1" "enter"
            New-Item -ItemType File -Force -Path "$sliceDir\phase1-started" | Out-Null
            $handExe = "$env:GITHUB_WORKSPACE\target\x86_64-pc-windows-msvc\release\bimo-hand-self-test.exe"
            & $handExe --slice --slice-inputs "$sliceDir\slice-inputs.json" --data-dir $handData --out "$sliceDir\hand-slice.json" --slice-phase install
            $phase1Code = $LASTEXITCODE
            $w = Get-Content "$sliceDir\slice-window.json" -Raw | ConvertFrom-Json
            if (Test-Path "$sliceDir\hand-slice.json") {
              $hs0 = Get-Content "$sliceDir\hand-slice.json" -Raw | ConvertFrom-Json
              if ($null -ne $hs0.steps.s3.ts) {
                $w.s3_ts = ([DateTimeOffset]::FromUnixTimeSeconds([int64]$hs0.steps.s3.ts)).ToString("o")
              }
            }
            if ([string]::IsNullOrEmpty($w.s3_ts)) { $w.s3_ts = ([DateTimeOffset]::UtcNow).ToString("o") }
            $w | ConvertTo-Json | Out-File -FilePath "$sliceDir\slice-window.json" -Encoding utf8
            $s3Succeeded = $false
            if (Test-Path "$sliceDir\hand-slice.json") {
              $hs = Get-Content "$sliceDir\hand-slice.json" -Raw | ConvertFrom-Json
              $s3Succeeded = ($hs.steps.s3.result.status -eq "done")
            }
            if ($phase1Code -ne 0) { Fail "Phase 1 fail: 8.12 install exited $phase1Code (see hand-slice.json)" }
            Write-Host "Phase 1 pass: negatives + S2+S3 done"
            # --- S-DIAG diagnostic capture (cycle 64, council 21 D1/D2) ---
            # Capture-only: runs between S3 and S6, BEFORE S7 can wipe
            # the uninstall key. NEVER throws: every capture is wrapped
            # so a failed capture is recorded as a field, never a step
            # failure — S6 must still run and judge the install, and
            # the captures must be published even if S6 fails (D2).
            # The five D1 items: (1) recursive listings of the three
            # named roots; (2) uninstall key read before S7;
            # (3) MSI /L*v log (enabled via MsiEnableLog in the
            # supervisor — the install invocation is untouched);
            # (4) notepad++.exe presence in the named locations only;
            # (5) MsiGetProductInfo (P/Invoke) crossed with the COM
            # ProductInfo read S6 makes next.
            Write-Checkpoint "S-DIAG" "enter"
            $diag = @{ step = "S-DIAG"; council = "21"; conditions = @("D1", "D2") }
            $diagErrors = @()
            # (1) Recursive listings of the three named roots.
            $diagRoots = @($env:WATCH_PARENT, "C:\Program Files\Notepad++", "C:\Program Files (x86)\Notepad++")
            $listingLines = [System.Collections.ArrayList]::new()
            $listingSummary = @()
            foreach ($root in $diagRoots) {
              $rootExists = Test-Path $root
              $entries = @()
              if ($rootExists) {
                try {
                  $all = Get-ChildItem -Recurse -Force -Path $root -ErrorAction Stop | Select-Object -First 2000
                  $entries = @($all | ForEach-Object { $_.FullName })
                  if ($all.Count -ge 2000) { $diagErrors += "listing-truncated: $root (2000+ entries)" }
                } catch { $diagErrors += "listing-failed: $root ($($_.Exception.Message))" }
              }
              [void]$listingLines.Add("== $root (exists=$rootExists, entries=$($entries.Count))")
              foreach ($e in $entries) { [void]$listingLines.Add($e) }
              $listingSummary += @{ root = $root; exists = $rootExists; entries = $entries.Count }
            }
            try { $listingLines | Out-File -FilePath "$sliceDir\diag-listing.txt" -Encoding utf8 } catch { $diagErrors += "listing-write-failed: $($_.Exception.Message)" }
            $diag.listing = $listingSummary
            # (2) Uninstall key read BEFORE S7 (S7 wipes it).
            $unKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$code"
            $unKeyPresent = Test-Path $unKey
            $unVals = @{ key_present = $unKeyPresent; install_location = $null; display_name = $null; uninstall_string = $null }
            if ($unKeyPresent) {
              try {
                $props = Get-ItemProperty -Path $unKey -ErrorAction Stop
                $unVals.install_location = $props.InstallLocation
                $unVals.display_name = $props.DisplayName
                $unVals.uninstall_string = $props.UninstallString
              } catch { $diagErrors += "uninstall-key-read-failed: $($_.Exception.Message)" }
            }
            try { $unVals | ConvertTo-Json | Out-File -FilePath "$sliceDir\diag-uninstall-key.json" -Encoding utf8 } catch { $diagErrors += "uninstall-key-write-failed: $($_.Exception.Message)" }
            $diag.uninstall_key = $unVals
            # (3) MSI /L*v log: copy from the hand data dir before S7.
            $msiLogSrc = "$handData\msi-install.log"
            $msiLogPresent = Test-Path $msiLogSrc
            $msiLogSize = $null
            if ($msiLogPresent) {
              try {
                Copy-Item $msiLogSrc "$sliceDir\msi-install.log" -Force -ErrorAction Stop
                $msiLogSize = (Get-Item "$sliceDir\msi-install.log").Length
              } catch { $diagErrors += "msi-log-copy-failed: $($_.Exception.Message)" }
            }
            $diag.msi_log = @{ present_in_hand_data = $msiLogPresent; copied_size_bytes = $msiLogSize }
            # (4) notepad++.exe presence in the named locations ONLY.
            $exeByRoot = @()
            foreach ($root in $diagRoots) {
              $found = $null
              if (Test-Path $root) {
                try { $found = Get-ChildItem -Recurse -Filter "notepad++.exe" -Path $root -ErrorAction SilentlyContinue | Select-Object -First 1 } catch {}
              }
              $exeByRoot += @{ root = $root; exe_present = ($null -ne $found); exe_path = $(if ($null -ne $found) { $found.FullName } else { $null }) }
            }
            $diag.exe_by_root = $exeByRoot
            # (5) MsiGetProductInfo (P/Invoke) — the cross-check half;
            # the COM half is S6's ProductInfo, read next.
            $msiLoc5 = $null; $msiLocRc5 = $null
            try {
              $len5 = [uint]1024
              $sb5 = New-Object System.Text.StringBuilder 1024
              $msiLocRc5 = [MsiNative]::MsiGetProductInfo($code, "InstallLocation", $sb5, [ref]$len5)
              if ($msiLocRc5 -eq 234) {
                $sb5 = New-Object System.Text.StringBuilder ([int]$len5)
                $msiLocRc5 = [MsiNative]::MsiGetProductInfo($code, "InstallLocation", $sb5, [ref]$len5)
              }
              if ($msiLocRc5 -eq 0) { $msiLoc5 = $sb5.ToString() }
            } catch { $diagErrors += "msi-get-product-info-failed: $($_.Exception.Message)" }
            $diag.msi_get_product_info = @{ rc = $msiLocRc5; install_location = $msiLoc5 }
            $diag.errors = $diagErrors
            try { $diag | ConvertTo-Json -Depth 5 | Out-File -FilePath "$sliceDir\diag.json" -Encoding utf8 } catch { Write-Host "S-DIAG: diag.json write failed: $($_.Exception.Message)" }
            Write-Host "S-DIAG done: listing roots=$($listingSummary.Count), uninstall_key_present=$unKeyPresent, msi_log_present=$msiLogPresent, errors=$($diagErrors.Count)"
            # --- S6 verify install (strong evidence; runs before S4/S5) ---
            # Cycle 65, council 22 E1 (b): InstallLocation NO LONGER
            # GATES S6. Diagnostic run 7 proved this MSI never writes
            # ARPINSTALLLOCATION, so requiring a non-empty location
            # asks for something impossible on this MSI. The verdict
            # is ProductState + the exe under SLICE_INSTALL_DIR (+ the
            # folder listing in S-DIAG, E3). $loc is still RECORDED in
            # s6.json as evidence, never judged.
            Write-Checkpoint "S6" "enter"
            $inst3 = New-Object -ComObject WindowsInstaller.Installer
            $s6 = @{ status = "pass"; reason = $null; product_state = $null; install_location = $null; exe_present = $false; exe_path = $null }
            try {
              $state6 = $inst3.ProductState($code)
              $s6.product_state = $state6
              $loc = $inst3.ProductInfo($code, "InstallLocation")
              $s6.install_location = $loc
              $exeFound = Get-ChildItem -Recurse -Filter "notepad++.exe" -Path $env:SLICE_INSTALL_DIR -ErrorAction SilentlyContinue | Select-Object -First 1
              $exePresent = $null -ne $exeFound
              $s6.exe_present = $exePresent
              if ($null -ne $exeFound) { $s6.exe_path = $exeFound.FullName }
              if ($state6 -in @(-1, 2)) { $s6.status = "fail"; $s6.reason = "product-absent-after-install (R3)" }
              elseif (-not $exePresent) { $s6.status = "fail"; $s6.reason = "notepad-exe-missing" }
            } catch {
              # §37.1 S6-unreadable: assume present (fail-closed) ->
              # mandatory revert -> fail-s6-unreadable (revert ok) or
              # fail-revert-failed (revert failed).
              $s6.status = "unreadable"; $s6.reason = "s6-unreadable: $($_.Exception.Message)"
            }
            $w = Get-Content "$sliceDir\slice-window.json" -Raw | ConvertFrom-Json
            $w.s6_ts = ([DateTimeOffset]::UtcNow).ToString("o")
            $w.window_end_ts = ([DateTimeOffset]::UtcNow).AddSeconds(30).ToString("o")
            $w | ConvertTo-Json | Out-File -FilePath "$sliceDir\slice-window.json" -Encoding utf8
            $s6 | ConvertTo-Json | Out-File -FilePath "$sliceDir\s6.json" -Encoding utf8
            if ($s6.status -eq "fail") { Fail "S6 fail: $($s6.reason)" }
            if ($s6.status -eq "unreadable") { Write-Host "S6 UNREADABLE: $($s6.reason) — mandatory revert follows (§37.1)" }
            else { Write-Host "S6 pass: installed, exe=$($s6.exe_path), InstallLocation recorded=$($s6.install_location) (not gated, council 22 E1)" }
            # --- S4 check witness (eye-events.jsonl) ---
            # Council 25, condition 1 (cycle 68): DYNAMIC SETTLE
            # before the witness read. Quiet = no new raw file event
            # (Create/Modify/Remove) under WATCH_PARENT, probe
            # prefix excluded, for a full debounce (2 s); then an
            # extra debounce (2 s) for the eye log to catch up.
            # Implemented as ONE 4 s quiet window over the raw tap
            # log (eye-raw-events.jsonl) — strictly stronger than
            # the two phases: if 4 s passed with no qualifying
            # event, both phases hold. Cap 30 s from settle start;
            # at the cap read anyway and record settle_cap_hit:
            # true — never a silent success on a cap. The four
            # settle timestamps go into witness.json (condition 4).
            # A missing raw log fails LOUDLY here: the settle cannot
            # be measured, and a missing log must never read as a
            # quiet tree (run-3 lesson).
            Write-Checkpoint "S4" "enter"
            $w = Get-Content "$sliceDir\slice-window.json" -Raw | ConvertFrom-Json
            $armTsW = [DateTimeOffset]::Parse($w.arm_ts)
            $endTs = [DateTimeOffset]::Parse($w.window_end_ts)
            $rawLogPath = "$eyeData\eye-raw-events.jsonl"
            if (-not (Test-Path $rawLogPath)) { Fail "S4 settle fail: raw log missing: $rawLogPath (the settle cannot be measured — never mistake a missing log for a quiet tree)" }
            $settleStartTs = [DateTimeOffset]::UtcNow
            $settleDeadline = $settleStartTs.AddSeconds(30)
            $settleCapHit = $false
            $lastRawFileEventTs = $null
            $quietSince = $settleStartTs
            $settled = $false
            while ([DateTimeOffset]::UtcNow -lt $settleDeadline) {
              $rawNow = Read-EyeLog -Path $rawLogPath
              $fileEvts = @($rawNow | Where-Object {
                $_.type -eq "raw.event" -and $_.kind -match "^(Create|Modify|Remove)" -and
                @($_.paths | Where-Object { $_ -like "$env:WATCH_PARENT*" -and $_ -notlike "$($w.probe_prefix)*" }).Count -gt 0
              })
              if ($fileEvts.Count -gt 0) {
                $lastRawFileEventTs = ($fileEvts | ForEach-Object { [DateTimeOffset]::Parse($_.ts) } | Sort-Object | Select-Object -Last 1)
                $quietSince = $lastRawFileEventTs
              }
              # 5 s NOMINAL quiet window (cycle 72, council 29 cond. 2):
              # raw timestamps are truncated to the second (run-13
              # finding), so a 5.0 s nominal gap guarantees > 4.0 s of
              # REAL quiet. The old 4.0 s nominal threshold only
              # guaranteed > 3.0 s real — run 13 landed under it.
              if (([DateTimeOffset]::UtcNow - $quietSince).TotalSeconds -ge 5) { $settled = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $settled) { $settleCapHit = $true }
            $settleDecisionTs = [DateTimeOffset]::UtcNow
            Write-Host "S4 settle: settled=$settled cap_hit=$settleCapHit last_raw_file_event_ts=$($lastRawFileEventTs) waited=$([Math]::Round(($settleDecisionTs - $settleStartTs).TotalSeconds, 2)) s"
            # Held Process object, not Get-Process by pid: no race.
            $eyeAlive = ($null -ne $eyeProc) -and (-not $eyeProc.HasExited)
            # Council 25, condition 2: FRESH read from disk at
            # verdict time — never a cached parse.
            $s4ReadTs = [DateTimeOffset]::UtcNow
            $events = Read-EyeLog -Path $logPath
            $hits = @($events | Where-Object {
              $_.type -eq "install.detected" -and
              $_.path -like "$env:SLICE_INSTALL_DIR*" -and
              $_.path -notlike "$($w.probe_prefix)*" -and
              ([DateTimeOffset]::Parse($_.ts) -ge $armTsW) -and
              ([DateTimeOffset]::Parse($_.ts) -le $endTs)
            })
            $wit = @{ status = "pass"; reason = $null; eye_alive = $eyeAlive; hits = $hits.Count; window = @($armTsW.ToString("o"), $endTs.ToString("o")); settle_start_ts = $settleStartTs.ToString("o"); last_raw_file_event_ts = $(if ($null -ne $lastRawFileEventTs) { $lastRawFileEventTs.ToString("o") } else { $null }); settle_decision_ts = $settleDecisionTs.ToString("o"); s4_read_ts = $s4ReadTs.ToString("o"); settle_cap_hit = $settleCapHit }
            if (-not $eyeAlive) { $wit.status = "fail"; $wit.reason = "eye-dead (§28.2 condition 5 — recorded, never passed silently)" }
            elseif ($hits.Count -eq 0) { $wit.status = "fail"; $wit.reason = "witness-missed (R5)" }
            $wit | ConvertTo-Json | Out-File -FilePath "$sliceDir\witness.json" -Encoding utf8
            if ($wit.status -ne "pass") { Fail "S4 fail: $($wit.reason)" }
            Write-Host "S4 pass: $($hits.Count) install.detected event(s) in the window"
            # --- S5 shot ---
            Write-Checkpoint "S5" "enter"
            $shotExe = "$env:GITHUB_WORKSPACE\target\x86_64-pc-windows-msvc\release\bimo-shot-self-test.exe"
            & $shotExe --out "$sliceDir\shot-check.json"
            if ($LASTEXITCODE -ne 0) { Fail "S5 fail: shot-check exited $LASTEXITCODE (R6)" }
            Write-Host "S5 pass: shot-check written"
          } catch {
            $liveError = $_.Exception.Message
            Write-Host "S-LIVE phase error: $liveError"
          } finally {
            # --- S7 revert (mandatory when S3 succeeded) ---
            Write-Checkpoint "S7" "enter-finally"
            $s7 = $null
            if (-not $s3Succeeded) {
              Write-Host "S7 skipped: S3 did not complete (nothing to revert; probe-timeout-unsettled discards the machine)"
              $s7 = @{ status = "skipped"; reason = "s3-not-succeeded"; revert = $null; clean = $null }
              $s7 | ConvertTo-Json | Out-File -FilePath "$sliceDir\s7.json" -Encoding utf8
            } else {
              try {
                $handExe2 = "$env:GITHUB_WORKSPACE\target\x86_64-pc-windows-msvc\release\bimo-hand-self-test.exe"
                & $handExe2 --slice --slice-inputs "$sliceDir\slice-inputs.json" --data-dir $handData --out "$sliceDir\hand-slice.json" --slice-phase revert
                $revertCode = $LASTEXITCODE
                $inst4 = New-Object -ComObject WindowsInstaller.Installer
                $state7 = $inst4.ProductState($code)
                $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$code"
                $clean = @{
                  product_absent = ($state7 -in @(-1, 2))
                  install_dir_absent = (-not (Test-Path $env:SLICE_INSTALL_DIR))
                  start_menu_absent = (-not (Test-Path "$env:SLICE_INSTALL_DIR\Start Menu\Programs\Notepad++"))
                  uninstall_key_absent = (-not (Test-Path $key))
                }
                $clean.clean = ($clean.product_absent -and $clean.install_dir_absent -and $clean.start_menu_absent -and $clean.uninstall_key_absent)
                $s7 = @{ status = "pass"; reason = $null; revert_exit = $revertCode; clean = $clean }
                if ($revertCode -ne 0) { $s7.status = "fail"; $s7.reason = "fail-revert-failed (R4)" }
                elseif (-not $clean.clean) { $s7.status = "fail"; $s7.reason = "fail-revert-failed: not clean after revert" }
              } catch {
                $s7 = @{ status = "fail"; reason = "fail-revert-failed: $($_.Exception.Message)"; revert_exit = $null; clean = $null }
              }
              $s7 | ConvertTo-Json -Depth 4 | Out-File -FilePath "$sliceDir\s7.json" -Encoding utf8
              Write-Host "S7 $($s7.status): $($s7.reason)"
            }
            # --- Stop eye: capture the exit code BEFORE the step exits (A3-style) ---
            Write-Checkpoint "StopEye" "enter-finally"
            if ($null -ne $eyeProc) {
              # Measured BEFORE requesting the stop (run (a) fix): the
              # value must say whether the eye was alive when we asked.
              $eyeAliveBeforeStop = -not $eyeProc.HasExited
              New-Item -ItemType File -Force -Path "$eyeData\eye.stop" | Out-Null
              $eyeExited = $eyeProc.WaitForExit(15000)
              if ($eyeExited) {
                $eyeExitCode = $eyeProc.ExitCode
                $eyeExitTs = [DateTimeOffset]::UtcNow
                $eyeStoppedOk = $true
              } else {
                try { $eyeProc.Kill() } catch {}
                $eyeKilledByStop = $true
                $eyeProc.WaitForExit(5000) | Out-Null
                if ($eyeProc.HasExited) { $eyeExitCode = $eyeProc.ExitCode; $eyeExitTs = [DateTimeOffset]::UtcNow }
              }
              Write-Host "StopEye: alive_before_stop=$eyeAliveBeforeStop exited_on_stop=$eyeExited exit_code=$eyeExitCode killed_by_stop=$eyeKilledByStop"
            } else {
              Write-Host "StopEye: no eye process was ever armed"
            }
            # --- S8 assemble + publish (still inside the live step) ---
            Write-Checkpoint "S8" "enter-finally"
            function Read-JsonOrNull($p) {
              if (Test-Path $p) { try { return Get-Content $p -Raw | ConvertFrom-Json } catch { return $null } }
              return $null
            }
            $hs = Read-JsonOrNull "$sliceDir\hand-slice.json"
            $inputs = Read-JsonOrNull "$sliceDir\slice-inputs.json"
            $witF = Read-JsonOrNull "$sliceDir\witness.json"
            $shot = Read-JsonOrNull "$sliceDir\shot-check.json"
            $winF = Read-JsonOrNull "$sliceDir\slice-window.json"
            $s6F = Read-JsonOrNull "$sliceDir\s6.json"
            $s7F = Read-JsonOrNull "$sliceDir\s7.json"
            $diagF = Read-JsonOrNull "$sliceDir\diag.json"
            $timeoutCheck = Read-JsonOrNull "$sliceDir\slice-timeout-check.json"
            $verdict = "pass"
            $reasons = @()
            $phase1Started = Test-Path "$sliceDir\phase1-started"
            if ($null -ne $liveError) { $reasons += "live-step-phase-error: $liveError" }
            if ($null -eq $hs) {
              if ($phase1Started) { $reasons += "hand-slice-missing (probe-timeout-unsettled signature: no hand-slice.json)" }
              else { $reasons += "hand-slice-missing (phase 1 never ran — failure before the install phase)" }
              $verdict = "fail"
            }
            elseif ($hs.slice_exit_code -ne 0 -and $null -eq $hs.steps.s7) { $verdict = "fail"; $reasons += "install-phase-failed: $($hs.slice_failure)" }
            if ($null -ne $s6F -and $s6F.status -eq "unreadable") { $verdict = "fail"; $reasons += "fail-s6-unreadable" }
            elseif ($null -ne $s6F -and $s6F.status -ne "pass") { $verdict = "fail"; $reasons += "s6-failed: $($s6F.reason)" }
            if ($null -ne $witF -and $witF.status -ne "pass") { $verdict = "fail"; $reasons += "witness-failed: $($witF.reason)" }
            if ($null -eq $witF -and $s3Succeeded) { $verdict = "fail"; $reasons += "witness-missing" }
            if ($null -eq $shot) { $verdict = "fail"; $reasons += "shot-missing (R6)" }
            if ($null -ne $s7F -and $s7F.status -eq "fail") { $verdict = "fail"; $reasons += "s7-failed: $($s7F.reason)" }
            if ($null -ne $s7F -and $s7F.status -eq "skipped" -and $s3Succeeded) { $verdict = "fail"; $reasons += "s7-skipped-but-s3-succeeded" }
            # Eye lifetime display (council 17, S5): a missing exit
            # timestamp is "still alive at close", never "unknown s".
            $eyeLifetimeDisplay = "still alive at close"
            if ($null -ne $eyeExitTs -and $null -ne $eyeLaunchTs) {
              $eyeLifetimeDisplay = "$([Math]::Round(([DateTimeOffset]$eyeExitTs - [DateTimeOffset]$eyeLaunchTs).TotalSeconds, 1)) s"
            }
            $checkpoints | ConvertTo-Json -Depth 4 | Out-File -FilePath "$sliceDir\slice-checkpoints.json" -Encoding utf8
            # S1 GPG evidence (council 18, F1 + F3): version + homedir
            # + attempt number + full stderr of every import attempt.
            # Variables may be unassigned if S1 failed before them —
            # unassigned reads are $null here (no strict mode).
            $s1GpgVersionLine = $null
            if ($null -ne $gpgVersion) { $s1GpgVersionLine = ($gpgVersion -split "`r?`n" | Select-Object -First 1) }
            $s1GpgNppStderr = $null
            if (Test-Path "$sliceDir\gpg-npp-attempt1.stderr") { $s1GpgNppStderr = Get-Content "$sliceDir\gpg-npp-attempt1.stderr" -Raw }
            $s1Gpg = @{
              gnupghome = $gpgHome
              gpg_version_first_line = $s1GpgVersionLine
              keyserver_import_attempt = $gpgImportAttempt
              keyserver_import_stderr_attempts = $keyserverStderr
              npp_import_stderr = $s1GpgNppStderr
              mechanism_note = "F3: a success after a retry does not close the S1 mechanism question — it stays open and carried in the log"
            }
            $results = @{
              slice_id = $env:SLICE_ID
              run_id = $env:GITHUB_RUN_ID
              verdict = $verdict
              reasons = $reasons
              hand_slice = $hs
              slice_inputs = $inputs
              s1_note = if ($null -ne $inputs) { "four checks passed in the S1 step (hash, GPG, Authenticode, winget)" } else { "S1 did not complete (slice-inputs.json missing)" }
              s1_gpg = $s1Gpg
              eye_witness = $witF
              shot_check = $shot
              slice_window = $winF
              s6 = $s6F
              s7 = $s7F
              diag = $diagF
              checkpoints = $checkpoints
              timeout_check = $timeoutCheck
              eye_exit = @{ pid = $eyePid; exit_code = $eyeExitCode; exited_on_stop = $eyeStoppedOk; alive_before_stop = $eyeAliveBeforeStop; killed_by_stop = $eyeKilledByStop; lifetime = $eyeLifetimeDisplay }
              m5_note = "does not prove eye survival outside a live step nor device performance"
              restructure_note = "single-live-step restructure built on one unreplicated positive control (diagnostic run (a)); a slice-3 success must not be read back as proof that run (a) replicates"
              runner_note = "does not prove device performance"
            }
            $results | ConvertTo-Json -Depth 10 | Out-File -FilePath "$sliceDir\slice-results.json" -Encoding utf8
            "SLICE_VERDICT=$verdict" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            # Push to the spike-results branch under a DISTINCT name —
            # never clobber spike-results.json.
            $resultsName = "hand-thin-slice-run-$env:GITHUB_RUN_ID.json"
            git config user.name "BIMO"
            git config user.email "bimo@yassinsmr.local"
            git fetch origin spike-results
            git checkout spike-results
            Copy-Item "$sliceDir\slice-results.json" $resultsName
            git add $resultsName
            git commit -m "slice run $($env:GITHUB_RUN_ID): verdict $verdict" --allow-empty
            git push origin spike-results
            Write-Host "S8: slice-results.json pushed as $resultsName (verdict=$verdict)"
          }
          # NOTE: GITHUB_ENV writes take effect only in LATER steps, so
          # the in-step check below reads the script variable $verdict
          # (assigned in the finally block), not $env:SLICE_VERDICT.
          # The separate Slice verdict gate step reads the env var.
          if ($verdict -ne "pass") { throw "slice verdict: $verdict — per council 27 reopen rule, a non-pass run reopens M5 immediately; no further slice run without a new council" }
          Write-Host "slice verdict: pass"

      - name: Upload slice results + raw logs (mandatory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hand-thin-slice-run-${{ github.run_id }}
          path: |
            ${{ env.SLICE_DIR }}\slice-results.json
            ${{ env.SLICE_DIR }}\hand-slice.json
            ${{ env.SLICE_DIR }}\slice-inputs.json
            ${{ env.SLICE_DIR }}\slice-window.json
            ${{ env.SLICE_DIR }}\witness.json
            ${{ env.SLICE_DIR }}\shot-check.json
            ${{ env.SLICE_DIR }}\s6.json
            ${{ env.SLICE_DIR }}\s7.json
            ${{ env.SLICE_DIR }}\diag.json
            ${{ env.SLICE_DIR }}\diag-listing.txt
            ${{ env.SLICE_DIR }}\diag-uninstall-key.json
            ${{ env.SLICE_DIR }}\msi-install.log
            ${{ env.SLICE_DIR }}\slice-checkpoints.json
            ${{ env.SLICE_DIR }}\slice-timeout-check.json
            ${{ env.SLICE_DIR }}\gpg-version.txt
            ${{ env.SLICE_DIR }}\gpg-keyserver-attempt1.stderr
            ${{ env.SLICE_DIR }}\gpg-keyserver-attempt2.stderr
            ${{ env.SLICE_DIR }}\gpg-npp-attempt1.stderr
            ${{ env.EYE_DATA }}\eye-events.jsonl
            ${{ env.EYE_DATA }}\eye-raw-events.jsonl
            ${{ env.SLICE_DIR }}\eye-stdout.log
            ${{ env.SLICE_DIR }}\eye-stderr.log
          if-no-files-found: warn

      - name: Slice verdict gate
        if: always()
        shell: pwsh
        run: |
          if ($env:SLICE_VERDICT -ne "pass") { throw "slice verdict: $($env:SLICE_VERDICT)" }
          Write-Host "slice verdict: pass"
