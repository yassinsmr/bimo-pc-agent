# Eye diagnostic run (a) — council 16, cycle 59. THE decisive test.
#
# Council 16 ruled (a) as a TEST first, never as a fix before its
# result: ONE diagnostic run in which the eye lives a full cycle
# (arm + 30 s idle + 2 probes + stop) inside ONE live pwsh step.
# Run 4 measured the death: eye / control / monitor all died ~4.9 s
# AFTER D1 ended, aligned with D2's start — the killer is in the
# launch/step environment, but the exact mechanism is still unknown
# and NO exit code was ever captured in 4 runs. This run tests the
# lifecycle hypothesis directly: if the eye survives a full cycle
# inside a step that never ends, the step boundary is the killer and
# (a) becomes the fix; if it dies INSIDE the live step, the hypothesis
# falls entirely and the matter goes to council 17 — no silent upgrade
# to (b) or (c) (A5).
#
# Design (council 16, binding A1–A5):
# - ONE live step (D-LIVE) holds the eye's Process object from arming
#   to stop, so the exit code and agent.stop are captured BEFORE the
#   step exits (A3). No separate monitor process: the live step IS the
#   monitor — the run-4 monitor died as a D1 child, and its exit-file
#   job is now done directly by the step holding the Process objects.
# - The control (diag-control-pulse.ps1, 40 s pulse loop) is launched
#   inside the SAME live step, so it too is a child of a step that
#   never ends during the cycle. If it dies early inside the live
#   step, the killer is NOT the step boundary at all.
# - No eye code change (workflow change only): --heartbeat-secs stays
#   1 s, same binary, same arming form as runs 1–4.
# - M5 tag (A2, carried): any success of (a) is tagged explicitly:
#   "does not prove eye survival outside a live step nor device
#   performance". (a) is NOT called a fix before its result.
# - A4 (standing rule): BIMO_EYE_PLAINTEXT_OK inside the step only,
#   never job/machine scope, never on the Legion path.
# - A5: if (a) fails, NO new run until a new council.
# - A1: no slice run 3 until this run succeeds.
#
# Verdicts (job passes on diagnosed-*, fails otherwise):
#   diagnosed-eye-lived-full-cycle — eye alive at 30 s, fresh
#     heartbeat, agent.stop present, exit code captured, both probes
#     sensed. Hypothesis CONFIRMED; (a) becomes the fix candidate.
#   diagnosed-eye-lived-probes-missed — same survival, but a probe
#     missed: survival confirmed, sensing question stays separate.
#   diagnosed-eye-died-inside-live-step — eye dead while the step was
#     alive, WITH its exit code captured. Hypothesis FALSIFIED.
#   diagnosed-control-died-inside-live-step — eye lived but the
#     control died early inside the live step: the killer is not the
#     step boundary at all.
#   diagnosed-never-armed / diagnosed-log-encrypted — as before.
#   inconclusive-by-design — A3 violated (no exit code captured) or no
#     signature rule matched; goes to council 17 with the same
#     question, no 5th diagnostic without it.
#
# Standing rule: the TEMPORARY push trigger is removed immediately
# after this run fires (one push only). The spike workflow gets NO
# trigger ever. workflow_dispatch is kept so the workflow stays
# triggerable if it ever reaches main.
on:
  workflow_dispatch:
  push:
    branches: [hand-thin-slice-c50]

permissions:
  contents: write

env:
  WATCH_PARENT: 'C:\bimo-slice'

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hand-thin-slice-c50

      - name: Install Rust (stable + MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build eye for Windows
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --locked -p bimo-eye

      - name: D0 precheck (diag dir + watched parent)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $diagId = "diag-$env:GITHUB_RUN_ID"
          $diagDir = "$env:RUNNER_TEMP\bimo-diag-$diagId"
          $eyeData = "$diagDir\eye-data"
          "DIAG_ID=$diagId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DIAG_DIR=$diagDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EYE_DATA=$eyeData" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $eyeData | Out-Null
          # Same watched parent as the failing slice runs, so the result
          # is comparable: the ONLY difference is the single live step.
          New-Item -ItemType Directory -Force -Path $env:WATCH_PARENT | Out-Null
          Write-Host "D0 pass: diag dir $diagDir"

      - name: D-LIVE full cycle inside ONE live step (council 16, (a))
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          . $env:GITHUB_WORKSPACE\.github\scripts\spike-log.ps1
          $stepStartTs = [DateTimeOffset]::UtcNow
          $eyeProc = $null; $controlProc = $null
          $eyePid = $null; $controlPid = $null
          $eyeLaunchTs = $null; $controlLaunchTs = $null
          $armed = $false; $armTs = $null
          $phase = @{}
          try {
            # --- Phase 1: arm eye + control (same forms as runs 1–4) ---
            $env:BIMO_EYE_PLAINTEXT_OK = "1"
            $pwsh = (Get-Command pwsh -ErrorAction Stop).Source
            $eyeExe = "$env:GITHUB_WORKSPACE\target\x86_64-pc-windows-msvc\release\bimo-eye-self-test.exe"
            $eyeProc = Start-Process -FilePath $eyeExe -ArgumentList @(
              "--watch", "--data-dir", $env:EYE_DATA,
              "--watch-dirs", $env:WATCH_PARENT,
              "--snapshot-secs", "1", "--heartbeat-secs", "1",
              "--max-secs", "1800"
            ) -WindowStyle Hidden -PassThru -RedirectStandardOutput "$env:DIAG_DIR\eye-stdout.log" -RedirectStandardError "$env:DIAG_DIR\eye-stderr.log"
            $eyePid = $eyeProc.Id
            $eyeLaunchTs = [DateTimeOffset]::UtcNow
            $eyePid | Out-File -FilePath "$env:DIAG_DIR\eye-pid.txt" -Encoding utf8
            # Control: same pulse loop as run 4 (500 ms), 40 s — it must
            # exit naturally before the live step ends (~45–50 s), so its
            # exit code is capturable from the Process object held here.
            $controlProc = Start-Process -FilePath $pwsh -ArgumentList @(
              "-NoProfile", "-File", "$env:GITHUB_WORKSPACE\.github\scripts\diag-control-pulse.ps1",
              "-PulseFile", "$env:DIAG_DIR\control-pulse.log", "-Seconds", "40"
            ) -WindowStyle Hidden -PassThru -RedirectStandardOutput "$env:DIAG_DIR\control-stdout.log" -RedirectStandardError "$env:DIAG_DIR\control-stderr.log"
            $controlPid = $controlProc.Id
            $controlLaunchTs = [DateTimeOffset]::UtcNow
            $controlPid | Out-File -FilePath "$env:DIAG_DIR\control-pid.txt" -Encoding utf8
            @{ eye_pid = $eyePid; eye_launch_ts = $eyeLaunchTs.ToString("o"); control_pid = $controlPid; control_launch_ts = $controlLaunchTs.ToString("o"); control_mode = "pulse-loop-500ms"; control_pulse_secs = 40; heartbeat_secs = 1; step_start_ts = $stepStartTs.ToString("o") } | ConvertTo-Json | Out-File -FilePath "$env:DIAG_DIR\diag-control.json" -Encoding utf8
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline) {
              $hb = "$env:EYE_DATA\heartbeat.json"
              if (Test-Path $hb) {
                $ts = (Get-Content $hb -Raw | ConvertFrom-Json).ts
                $age = ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($ts)).TotalSeconds
                if ($age -lt 10) { $armed = $true; break }
              }
              Start-Sleep -Milliseconds 500
            }
            $armTs = [DateTimeOffset]::UtcNow
            $phase.arm = @{ armed = $armed; arm_ts = $armTs.ToString("o"); eye_alive_at_arm = (-not $eyeProc.HasExited); control_alive_at_arm = (-not $controlProc.HasExited) }
            Write-Host "D-LIVE phase 1 (arm): armed=$armed eye_pid=$eyePid control_pid=$controlPid"
            # --- Phase 2: idle 15 s + liveness snapshot ---
            $p2Start = [DateTimeOffset]::UtcNow
            Start-Sleep -Seconds 15
            $phase.liveness_15s = Get-Liveness -At "15s" -StepStart $p2Start -EyeProc $eyeProc -ControlProc $controlProc
            Write-Host "D-LIVE phase 2 (15s): alive=$($phase.liveness_15s.process_alive) control_alive=$($phase.liveness_15s.control_alive) hb_age=$($phase.liveness_15s.heartbeat_age_secs) lines=$($phase.liveness_15s.log_lines)"
            # --- Phase 3: probes at ~15 s (root + new subdir) + 10 s sense ---
            $p3Start = [DateTimeOffset]::UtcNow
            $probeRoot = "$env:WATCH_PARENT\diag-probe-root-$env:DIAG_ID.exe"
            New-Item -ItemType File -Force -Path $probeRoot | Out-Null
            $probeDir = "$env:WATCH_PARENT\diag-probe-sub-$env:DIAG_ID"
            New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
            $probeSub = "$probeDir\probe.exe"
            New-Item -ItemType File -Force -Path $probeSub | Out-Null
            $logPath = "$env:EYE_DATA\eye-events.jsonl"
            $deadline = (Get-Date).AddSeconds(10)
            $seenRoot = $false; $seenSub = $false; $logEncrypted = $false
            while ((Get-Date) -lt $deadline) {
              $events = Read-EyeLog -Path $logPath
              if ($events.Count -gt 0 -and (@($events | Where-Object { $null -ne $_.type }).Count -eq 0)) {
                $logEncrypted = $true
                break
              }
              if (@($events | Where-Object { $_.path -eq $probeRoot -and $_.type -in @("file.completed", "install.detected") }).Count -ge 1) { $seenRoot = $true }
              if (@($events | Where-Object { $_.path -eq $probeSub -and $_.type -in @("file.completed", "install.detected") }).Count -ge 1) { $seenSub = $true }
              if ($seenRoot -and $seenSub) { break }
              Start-Sleep -Milliseconds 500
            }
            Remove-Item -Force $probeRoot -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $probeDir -ErrorAction SilentlyContinue
            $phase.probes = @{ probe_root = $probeRoot; probe_root_seen = $seenRoot; probe_sub = $probeSub; probe_sub_seen = $seenSub; log_encrypted = $logEncrypted; step_start_ts = $p3Start.ToString("o") }
            Write-Host "D-LIVE phase 3 (probes): root_seen=$seenRoot sub_seen=$seenSub log_encrypted=$logEncrypted"
            # --- Phase 4: idle to 30 s + liveness snapshot ---
            $p4Start = [DateTimeOffset]::UtcNow
            Start-Sleep -Seconds 5
            $phase.liveness_30s = Get-Liveness -At "30s" -StepStart $p4Start -EyeProc $eyeProc -ControlProc $controlProc
            Write-Host "D-LIVE phase 4 (30s): alive=$($phase.liveness_30s.process_alive) control_alive=$($phase.liveness_30s.control_alive) hb_age=$($phase.liveness_30s.heartbeat_age_secs) lines=$($phase.liveness_30s.log_lines)"
            # --- Phase 5: stop eye + capture exit code BEFORE step exit (A3) ---
            $p5Start = [DateTimeOffset]::UtcNow
            $eyeAliveBeforeStop = -not $eyeProc.HasExited
            $stopRequestedTs = [DateTimeOffset]::UtcNow
            New-Item -ItemType File -Force -Path "$env:EYE_DATA\eye.stop" | Out-Null
            $eyeExited = $eyeProc.WaitForExit(15000)
            $eyeExitCode = $null; $eyeExitTs = $null; $eyeKilledByStop = $false
            if ($eyeExited) {
              $eyeExitCode = $eyeProc.ExitCode
              $eyeExitTs = [DateTimeOffset]::UtcNow
            } else {
              # Eye did not stop on eye.stop within 15 s: kill it here and
              # record that WE killed it, so the exit code is never read
              # as a natural death (same rule as run 4 D5).
              try { $eyeProc.Kill() } catch {}
              $eyeKilledByStop = $true
              $eyeProc.WaitForExit(5000) | Out-Null
            }
            $phase.stop = @{
              step_start_ts = $p5Start.ToString("o"); stop_requested_ts = $stopRequestedTs.ToString("o")
              eye_exited_on_stop = $eyeExited; eye_exit_code = $eyeExitCode
              eye_exit_ts = $(if ($null -ne $eyeExitTs) { $eyeExitTs.ToString("o") } else { $null })
              eye_killed_by_stop = $eyeKilledByStop
              eye_has_exited = $eyeProc.HasExited
              eye_alive_before_stop = $eyeAliveBeforeStop
            }
            Write-Host "D-LIVE phase 5 (stop): alive_before_stop=$eyeAliveBeforeStop exited_on_stop=$eyeExited exit_code=$eyeExitCode killed_by_stop=$eyeKilledByStop"
            # --- Phase 6: control close-out (exit code or still-alive) ---
            $controlExited = $controlProc.WaitForExit(10000)
            $controlExitCode = $null; $controlExitTs = $null
            if ($controlExited) {
              $controlExitCode = $controlProc.ExitCode
              $controlExitTs = [DateTimeOffset]::UtcNow
            }
            $phase.control_closeout = @{
              control_exited = $controlExited; control_exit_code = $controlExitCode
              control_exit_ts = $(if ($null -ne $controlExitTs) { $controlExitTs.ToString("o") } else { $null })
              control_has_exited = $controlProc.HasExited
            }
            Write-Host "D-LIVE phase 6 (control): exited=$controlExited exit_code=$controlExitCode"
          } catch {
            $phase.step_error = $_.Exception.Message
            Write-Host "D-LIVE step error: $($_.Exception.Message)"
          } finally {
            # --- Phase 7: evidence, still inside the live step ---
            $p7Start = [DateTimeOffset]::UtcNow
            $logPath = "$env:EYE_DATA\eye-events.jsonl"
            $lines = 0; $lastTs = $null; $hasAgentStop = $false
            $eyeEvents = @()
            if (Test-Path $logPath) {
              $raw = Get-Content $logPath -ErrorAction SilentlyContinue
              $lines = @($raw).Count
              if ($lines -gt 0) { $lastTs = ($raw[-1] | ConvertFrom-Json -ErrorAction SilentlyContinue).ts }
              $hasAgentStop = @($raw | Where-Object { $_ -match '"type":"agent.stop"' }).Count -ge 1
              $eyeEvents = Read-EyeLog -Path $logPath
            }
            $hbAge = $null; $hbTs = $null
            $hb = "$env:EYE_DATA\heartbeat.json"
            if (Test-Path $hb) {
              $hbTs = (Get-Content $hb -Raw | ConvertFrom-Json).ts
              $hbAge = ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($hbTs)).TotalSeconds
            }
            $stderrLines = @()
            if (Test-Path "$env:DIAG_DIR\eye-stderr.log") { $stderrLines = @(Get-Content "$env:DIAG_DIR\eye-stderr.log" -ErrorAction SilentlyContinue) }
            $exitTrace = ($stderrLines | Where-Object { $_ -match 'writer_loop exit' }) -join "`n"
            if ([string]::IsNullOrWhiteSpace($exitTrace)) { $exitTrace = $null }
            $controlStats = Get-PulseStats -Path "$env:DIAG_DIR\control-pulse.log"
            $eyeHbTs = $null
            if ($null -ne $hbTs) { $eyeHbTs = [DateTimeOffset]::Parse($hbTs) }
            $eyeLogLastTs = $null
            $eyeTsList = @()
            foreach ($e in $eyeEvents) { try { $eyeTsList += [DateTimeOffset]::Parse($e.ts) } catch {} }
            if ($eyeTsList.Count -gt 0) { $eyeLogLastTs = $eyeTsList[-1] }
            $eyeLastAlive = $null
            if ($null -ne $eyeHbTs -and $null -ne $eyeLogLastTs) { $eyeLastAlive = if ($eyeHbTs -gt $eyeLogLastTs) { $eyeHbTs } else { $eyeLogLastTs } }
            elseif ($null -ne $eyeHbTs) { $eyeLastAlive = $eyeHbTs }
            elseif ($null -ne $eyeLogLastTs) { $eyeLastAlive = $eyeLogLastTs }
            $live = @{
              diag_id = $env:DIAG_ID; step_start_ts = $stepStartTs.ToString("o"); step_end_ts = $p7Start.ToString("o")
              armed = $armed; arm_ts = $(if ($null -ne $armTs) { $armTs.ToString("o") } else { $null })
              eye_pid = $eyePid; eye_launch_ts = $(if ($null -ne $eyeLaunchTs) { $eyeLaunchTs.ToString("o") } else { $null })
              control_pid = $controlPid; control_launch_ts = $(if ($null -ne $controlLaunchTs) { $controlLaunchTs.ToString("o") } else { $null })
              phases = $phase
              final = @{
                log_lines = $lines; last_ts = $lastTs; has_agent_stop = $hasAgentStop
                heartbeat_ts = $hbTs; heartbeat_age_secs = $hbAge
                writer_exit_trace = $exitTrace; eye_stopped_file = (Test-Path "$env:EYE_DATA\eye.stopped")
                eye_last_alive_ts = $(if ($null -ne $eyeLastAlive) { $eyeLastAlive.ToString("o") } else { $null })
                control_pulse_count = $controlStats.count; control_pulse_max_gap_secs = $controlStats.max_gap_secs
                control_last_pulse_ts = $controlStats.last_ts
              }
            }
            $live | ConvertTo-Json -Depth 10 | Out-File -FilePath "$env:DIAG_DIR\diag-live-cycle.json" -Encoding utf8
            Write-Host "D-LIVE done: armed=$armed lines=$lines agent_stop=$hasAgentStop eye_exit_code=$($phase.stop.eye_exit_code) control_exit_code=$($phase.control_closeout.control_exit_code)"
          }

      - name: D6 Defender note (cheap observation, never fails the run)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $rt = $null
          try {
            $st = Get-MpComputerStatus -ErrorAction Stop
            $rt = $st.RealTimeProtectionEnabled
          } catch { $rt = "unavailable" }
          @{ defender_realtime_protection = $rt } | ConvertTo-Json | Out-File -FilePath "$env:DIAG_DIR\diag-defender.json" -Encoding utf8
          Write-Host "D6: Defender real-time protection = $rt"

      - name: D6b event-log check (fallback evidence, never fails the run)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $live = Get-Content "$env:DIAG_DIR\diag-live-cycle.json" -Raw | ConvertFrom-Json
          $eyePid = $live.eye_pid
          $start = [DateTimeOffset]::Parse($live.arm_ts).AddSeconds(-5)
          $end = [DateTimeOffset]::UtcNow
          $entries = @()
          $queried = $true
          $note = $null
          try {
            $evts = Get-WinEvent -FilterHashtable @{ LogName = @('Application', 'System'); StartTime = $start.DateTime; EndTime = $end.DateTime } -MaxEvents 200 -ErrorAction Stop | Where-Object { $_.Message -match 'bimo-eye' -or $_.Message -match "$eyePid" }
            foreach ($e in @($evts)) {
              $entries += @{ time = $e.TimeCreated.ToString("o"); log = $e.LogName; id = $e.Id; level = $e.LevelDisplayName; message = ($e.Message -replace "`r`n", " " -replace "`n", " ").Substring(0, [Math]::Min(300, $e.Message.Length)) }
            }
          } catch {
            if ($_.Exception.Message -match 'No events were found') { $note = "no matching events in window" }
            else { $queried = $false; $note = $_.Exception.Message }
          }
          @{ queried = $queried; window_start = $start.ToString("o"); window_end = $end.ToString("o"); count = $entries.Count; entries = $entries; note = $note } | ConvertTo-Json -Depth 5 | Out-File -FilePath "$env:DIAG_DIR\diag-eventlog.json" -Encoding utf8
          Write-Host "D6b: event log queried=$queried entries=$($entries.Count) note=$note"

      - name: D7 publish (assemble verdict JSON + push to spike-results)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          . $env:GITHUB_WORKSPACE\.github\scripts\spike-log.ps1
          $live = Get-Content "$env:DIAG_DIR\diag-live-cycle.json" -Raw | ConvertFrom-Json
          $def = Get-Content "$env:DIAG_DIR\diag-defender.json" -Raw | ConvertFrom-Json
          $evlog = $null
          if (Test-Path "$env:DIAG_DIR\diag-eventlog.json") { $evlog = Get-Content "$env:DIAG_DIR\diag-eventlog.json" -Raw | ConvertFrom-Json }
          $ctl = Get-Content "$env:DIAG_DIR\diag-control.json" -Raw | ConvertFrom-Json
          $ph = $live.phases
          $fin = $live.final
          $eyeExitCode = $ph.stop.eye_exit_code
          $eyeExitedOnStop = $ph.stop.eye_exited_on_stop
          $eyeKilledByStop = $ph.stop.eye_killed_by_stop
          $controlExitCode = $ph.control_closeout.control_exit_code
          $controlExited = $ph.control_closeout.control_exited
          # Control lifetime: launch -> exit (or last pulse if still
          # alive at close-out). The loop is 40 s; a lifetime under
          # 35 s means it died early INSIDE the live step.
          $controlLifetimeSecs = $null; $controlDiedEarly = $false; $controlSurvived = $false
          if ($controlExited -and $null -ne $ph.control_closeout.control_exit_ts) {
            $controlLifetimeSecs = ([DateTimeOffset]::Parse($ph.control_closeout.control_exit_ts) - [DateTimeOffset]::Parse($ctl.control_launch_ts)).TotalSeconds
            if ($controlLifetimeSecs -lt 35) { $controlDiedEarly = $true } else { $controlSurvived = $true }
          } elseif (-not $controlExited) {
            # Still alive at close-out (~45–50 s after launch): it
            # outlived its 40 s loop window — survived by definition.
            $controlSurvived = $true
          }
          $controlLifetimeDisplay = "unknown"
          if ($null -ne $controlLifetimeSecs) { $controlLifetimeDisplay = "$([Math]::Round($controlLifetimeSecs, 1))" }
          # Eye death inside the live step: dead at a liveness snapshot
          # while the step was alive, OR exited before we asked it to
          # stop (no agent.stop, exit code captured from the Process
          # object). A3 is satisfied iff an exit code was captured.
          $eyeDiedInside = $false; $eyeDeathNote = $null
          if ($ph.liveness_15s.process_alive -eq $false -or $ph.liveness_30s.process_alive -eq $false) {
            $eyeDiedInside = $true
            $eyeDeathNote = "eye dead at a liveness snapshot inside the live step (15 s alive: $($ph.liveness_15s.process_alive); 30 s alive: $($ph.liveness_30s.process_alive))"
          } elseif (-not $eyeExitedOnStop -and -not $eyeKilledByStop -and $null -ne $eyeExitCode) {
            # Exited on its own before the stop wait finished without us
            # killing it — but WaitForExit(15000) returning false with an
            # exit code cannot happen; this branch is defensive.
            $eyeDiedInside = $true
            $eyeDeathNote = "eye exited on its own during the stop wait (exit code $eyeExitCode)"
          } elseif ($fin.has_agent_stop -eq $false -and $eyeKilledByStop -eq $false -and $null -ne $eyeExitCode -and $eyeExitedOnStop) {
            # It exited after eye.stop but wrote NO agent.stop: it died
            # on its own timing, not on our stop. Distinguish by the
            # stop file: if eye.stopped exists, the stop was honoured.
            if (-not $fin.eye_stopped_file) {
              $eyeDiedInside = $true
              $eyeDeathNote = "eye exited after eye.stop with exit code $eyeExitCode but NO agent.stop and NO eye.stopped file: death on its own timing inside the live step"
            }
          }
          $eyeLived = ($ph.liveness_30s.process_alive -eq $true) -and ($ph.liveness_30s.heartbeat_age_secs -lt 10) -and ($fin.has_agent_stop -eq $true) -and ($null -ne $eyeExitCode)
          $eventlogCount = 0
          if ($null -ne $evlog) { $eventlogCount = $evlog.count }
          # Signature priority (council 16, A1–A5): moot cases first,
          # then the decisive question — did the eye live or die INSIDE
          # the live step? A run that captures no exit code at all is
          # inconclusive-by-design (A3), never evidence for any killer.
          $signature = "inconclusive"; $reasons = @()
          if (-not $live.armed) { $signature = "diagnosed-never-armed"; $reasons += "eye never armed: no fresh heartbeat in 30 s" }
          elseif ($ph.probes.log_encrypted) { $signature = "diagnosed-log-encrypted"; $reasons += "log lines carry no type field (DPAPI wrappers): plaintext opt-in regressed" }
          elseif ($eyeDiedInside) { $signature = "diagnosed-eye-died-inside-live-step"; $reasons += "$eyeDeathNote; exit code captured from the live step's Process object: $eyeExitCode (A3 satisfied)"; $reasons += "the lifecycle hypothesis is FALSIFIED: the eye died while its launching step was still alive — the killer is not the step boundary"; if ($null -ne $fin.writer_exit_trace) { $reasons += "writer exit trace: $($fin.writer_exit_trace)" } else { $reasons += "no writer_loop exit trace in stderr (same no-trace death as runs 1–4, now inside a live step)" }; if ($controlDiedEarly) { $reasons += "control ALSO died early inside the live step (lifetime $($controlLifetimeDisplay) s): the killer strikes children of a live step too" } }
          elseif ($controlDiedEarly -and $eyeLived) { $signature = "diagnosed-control-died-inside-live-step"; $reasons += "eye LIVED the full cycle (alive at 30 s, agent.stop present, exit code $eyeExitCode) but the control died early inside the SAME live step (lifetime $($controlLifetimeDisplay) s): the killer is not the step boundary at all — it strikes some children and not others"; $reasons += "exit codes captured from the live step's Process objects (A3 satisfied): eye $eyeExitCode, control $controlExitCode" }
          elseif ($eyeLived -and $ph.probes.probe_root_seen -and $ph.probes.probe_sub_seen) { $signature = "diagnosed-eye-lived-full-cycle"; $reasons += "FIRST POSITIVE CONTROL: eye alive at 30 s with fresh heartbeat ($($ph.liveness_30s.heartbeat_age_secs) s), both probes sensed, agent.stop present, exit code $eyeExitCode captured from the live step's Process object (A3 satisfied)"; $reasons += "the lifecycle hypothesis is CONFIRMED: the eye survives a full cycle inside a step that never ends — (a) becomes the fix candidate for council 17"; if ($controlSurvived) { $reasons += "control survived its 40 s pulse loop (lifetime $($controlLifetimeDisplay) s, exit code $controlExitCode): the launch environment is healthy inside a live step" } }
          elseif ($eyeLived) { $signature = "diagnosed-eye-lived-probes-missed"; $reasons += "eye LIVED the full cycle (alive at 30 s, agent.stop present, exit code $eyeExitCode) but a probe missed (root seen: $($ph.probes.probe_root_seen); sub seen: $($ph.probes.probe_sub_seen)): survival confirmed, sensing question stays separate"; $reasons += "the lifecycle hypothesis is CONFIRMED on survival; the watcher-silent question is a separate finding for council 17" }
          elseif ($null -eq $eyeExitCode -and $eventlogCount -eq 0) { $signature = "inconclusive-by-design"; $reasons += "A3 violated: NO exit code captured for the eye AND no event-log entry — inconclusive BY DESIGN, not evidence for any killer; council 17 decides with the same question, no 5th diagnostic without it" }
          else { $reasons += "no signature rule matched (eye lived: $eyeLived; died inside: $eyeDiedInside; exit code: $eyeExitCode; agent.stop: $($fin.has_agent_stop))" }
          $verdict = $signature
          $results = @{
            run_id = $env:GITHUB_RUN_ID; diag_id = $env:DIAG_ID; verdict = $verdict; signature = $signature; reasons = $reasons
            run = 5; council = 16; run_kind = "a-live-step-test"
            m5_note = "does not prove eye survival outside a live step nor device performance"
            armed = $live.armed; arm_ts = $live.arm_ts; eye_pid = $live.eye_pid
            live_cycle = $live; defender = $def
            control = @{ pid = $ctl.control_pid; launch_ts = $ctl.control_launch_ts; mode = $ctl.control_mode; pulse_secs = $ctl.control_pulse_secs; heartbeat_secs = $ctl.heartbeat_secs; exit_code = $controlExitCode; lifetime_secs = $controlLifetimeSecs; died_early = $controlDiedEarly; survived = $controlSurvived }
            eye_exit = @{ exit_code = $eyeExitCode; exited_on_stop = $eyeExitedOnStop; natural = (-not $eyeKilledByStop); killed_by_stop = $eyeKilledByStop }
            eventlog = $evlog
            runner_note = "does not prove device performance"
          }
          $results | ConvertTo-Json -Depth 12 | Out-File -FilePath "$env:DIAG_DIR\eye-diagnostic-results.json" -Encoding utf8
          "EYE_DIAG_VERDICT=$verdict" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Push the verdict JSON to spike-results under a distinct name.
          git config user.name "BIMO"
          git config user.email "bimo@yassinsmr.local"
          git fetch origin spike-results
          git checkout spike-results
          $resultsName = "eye-diagnostic-run-$env:GITHUB_RUN_ID.json"
          Copy-Item "$env:DIAG_DIR\eye-diagnostic-results.json" $resultsName
          git add $resultsName
          git commit -m "eye diagnostic run $env:GITHUB_RUN_ID`: verdict $verdict" --allow-empty
          git push origin spike-results
          Write-Host "D7: eye-diagnostic-results.json pushed as $resultsName (verdict=$verdict)"

      - name: D8 upload diagnostic results + raw logs (mandatory)
        uses: actions/upload-artifact@v4
        with:
          name: eye-diagnostic-run-${{ github.run_id }}
          path: |
            ${{ env.DIAG_DIR }}\eye-diagnostic-results.json
            ${{ env.DIAG_DIR }}\diag-live-cycle.json
            ${{ env.EYE_DATA }}\eye-events.jsonl
            ${{ env.DIAG_DIR }}\eye-stdout.log
            ${{ env.DIAG_DIR }}\eye-stderr.log
            ${{ env.DIAG_DIR }}\control-stdout.log
            ${{ env.DIAG_DIR }}\control-stderr.log
            ${{ env.DIAG_DIR }}\control-pulse.log
            ${{ env.DIAG_DIR }}\diag-*.json
          if-no-files-found: error

      - name: D9 diagnostic verdict gate
        shell: pwsh
        run: |
          if ($env:EYE_DIAG_VERDICT -notlike "diagnosed-*") { throw "eye diagnostic run (a): $($env:EYE_DIAG_VERDICT) — no decisive verdict; per council 16 condition A5 no new run until a new council" }
          Write-Host "eye diagnostic run (a): $($env:EYE_DIAG_VERDICT)"
